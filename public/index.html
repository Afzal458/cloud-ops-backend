<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login — Cloud Operations Center</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: 'DM Sans', sans-serif; background: #102b3d; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; }
        .login-box { background: #172c40; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #24485b; }
        h1 { font-family: 'Fraunces', serif; text-align: center; margin-top: 0; font-size: 24px; color: #39c8b5; }
        p { text-align: center; color: #9fc3d4; font-size: 14px; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; color: #c7d8e1; text-transform: uppercase; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #24485b; background: #102b3d; color: white; box-sizing: border-box; }
        input:focus { outline: none; border-color: #39c8b5; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #39c8b5; color: #102b3d; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #2ba89a; }
        .error { color: #ff6b6b; font-size: 13px; text-align: center; margin-bottom: 15px; display: none; }
        .demo-creds { text-align: center; margin-top: 20px; font-size: 12px; color: #607487; background: #102b3d; padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>◈ Cloud Operations</h1>
        <p>Sign in to access your dashboard</p>
        <div id="error-msg" class="error"></div>
        <form id="auth-form">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="demo@cloudops.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" id="submit-btn">Login</button>
        </form>
        <div class="demo-creds">Demo Login: <b>demo@cloudops.com</b> / <b>demo123</b></div>
    </div>
    <script>
        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const errorMsg = document.getElementById('error-msg');
            btn.textContent = 'Please wait...'; btn.disabled = true; errorMsg.style.display = 'none';
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Login failed');
                localStorage.setItem('token', data.token);
                localStorage.setItem('userName', data.user.name);
                window.location.href = '/dashboard';
            } catch (err) {
                errorMsg.textContent = err.message; errorMsg.style.display = 'block';
                btn.textContent = 'Login'; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
